# micron configuration
# All settings can be overridden by CLI args or environment variables

# Default provider (must match a key under `providers:`)
default_provider: lmstudio

# Context directory (skills, memory, knowledge, persona)
context_dir: context

# Knowledge directory — Obsidian vault friendly (wikilinks [[link|alias]], ![[embed]], subfolders, symlinks ~/vault)
# Defaults to <context_dir>/knowledge; override via MICRON_KNOWLEDGE_DIR env or this key.
# knowledge_dir: ~/vault

# Working directory for file tools (resolve relative paths against this)
workdir: /home/matt/Documents/sandbox/

# Generation settings
temperature: 0.1
max_tokens: 10000
max_tool_iterations: 10

# Server settings
host: 0.0.0.0
port: 8000

# Firecrawl settings (for web_search and fetch_url tools)
firecrawl_url: http://localhost:3002

# Provider configurations
#
# chat_format: LOCAL llamacpp backend ONLY. It selects the llama-cpp-python
# prompt handler and is auto-detected from the model filename when omitted:
#   qwen*            -> qwen
#   gemma*           -> gemma
#   llama-3*         -> llama-3
#   mistral*/mixtral*-> mistral-instruct
#   smollm*          -> smollm
#   anything else    -> chatml
# Set it explicitly only if the guess is wrong for your model family
# (wrong value = garbled prompts, no error message).
# Server-side providers (lmstudio, ollama, openrouter, openai, vllm) IGNORE
# this key: the server applies the model's own template. Setting it there
# only prints a startup warning.
providers:
  llamacpp:
    model: models/MiniCPM5-1B-Q8_0.gguf
    n_threads: 8
    n_gpu_layers: 0
    n_ctx: 8192
    chat_format: chatml

  openrouter:
    api_key: <your-openrouter-api-key>
    base_url: https://openrouter.ai/api/v1
    model: openrouter/auto

  lmstudio:
    api_key: no_key
    base_url: http://192.168.1.163:1234/v1
    # model: gemma-4-12b-it-qat
    # model: minicpm5-1b
    model: mistralai/ministral-3-14b-reasoning
    # NOTE: no chat_format here — LM Studio applies the model's own template.

  ollama:
    base_url: http://192.168.1.163:11434
    model: llama3
    # NOTE: no chat_format here — Ollama applies the model's own template.

  openai:
    api_key: <your-api-key>
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    # NOTE: no chat_format here — the API owns the template.